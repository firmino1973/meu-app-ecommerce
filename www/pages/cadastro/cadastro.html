<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Meu App Ecommerce</title>

    <link rel="stylesheet" href="cadastro.css">

</head>

<body>

    <div class="container">

        <h1>Meu App Ecommerce</h1>

        <p>Crie sua conta</p>

        <form id="form-cadastro">

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome completo"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <input
                type="tel"
                id="telefone"
                placeholder="Digite seu telefone"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <input
                type="password"
                id="confirmar-senha"
                placeholder="Confirme sua senha"
                required
            >

            <button type="submit">
                Criar conta
            </button>

        </form>

        <p>
            Já possui uma conta?
            <a href="../login/login.html">
                Fazer login
            </a>
        </p>

    </div>

    <script src="cadastro.js"></script>

</body>

</html>
